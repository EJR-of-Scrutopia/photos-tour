# XcodeGen spec for the Photos tour: a do-nothing host app plus a UI-testing bundle that drives Apple's
# Photos app (com.apple.mobileslideshow) on an iOS simulator. Generated on the Mac by tour.sh.
name: PhotosTour
options:
  bundleIdPrefix: local.photostour
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # A generated Info.plist takes CFBundleVersion and CFBundleShortVersionString from these; without them the
    # simulator refuses to install the host app ("does not contain a valid CFBundleVersion").
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  TourHost:
    type: application
    platform: iOS
    sources: [TourHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.photostour.host
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        # Repeated at target level so no XcodeGen preset or Xcode default can switch on Swift 6 checking: Xcode 16+
        # marks XCUIApplication and XCUIElement @MainActor, which only Swift 5 mode treats as warnings.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  TourUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TourUITests]
    dependencies:
      - target: TourHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.photostour.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: TourHost
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  Tour:
    build:
      targets:
        TourHost: all
        TourUITests: [test]
    test:
      config: Debug
      targets:
        - TourUITests
