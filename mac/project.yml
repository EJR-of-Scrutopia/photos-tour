# XcodeGen spec for the Mac Photos tour: a do-nothing host app plus a macOS UI-testing bundle that drives Apple's
# Photos app (com.apple.Photos) on macOS 14. Generated by mac-tour.sh (run from the mac/ folder).
name: MacPhotosTour
options:
  bundleIdPrefix: local.macphotostour
  deploymentTarget:
    macOS: "13.0"
  # Xcode 15.4 cannot open XcodeGen 2.46's default xcode16_0 project format (found on the iOS tour, 18 October 2026).
  projectFormat: xcode15_3
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    # Signing off first; mac-tour.sh rebuilds with an ad-hoc signature if the unsigned runner never starts.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    # Hardened runtime would add library validation, which refuses an ad-hoc signed test bundle.
    ENABLE_HARDENED_RUNTIME: "NO"
targets:
  MacTourHost:
    type: application
    platform: macOS
    sources: [MacTourHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macphotostour.host
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  MacTourUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [MacTourUITests]
    dependencies:
      - target: MacTourHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macphotostour.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: MacTourHost
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  MacTour:
    build:
      targets:
        MacTourHost: all
        MacTourUITests: [test]
    test:
      config: Debug
      targets:
        - MacTourUITests
